<script>
// Printed pharmacy QR codes say https://dozi.app?utm_source=pharmacy&utm_campaign=ID&promo=CODE
// and used to land on the Dozi home page (the page view tracker reads the utm_* values there).
var q = location.search;
var pharmacy = /[?&](promo|utm_source=pharmacy)(=|&|$)/i.test(q);
location.replace((pharmacy ? "https://med.bardino.app/" : "https://bardino.app/tr/") + q + location.hash);
</script>
